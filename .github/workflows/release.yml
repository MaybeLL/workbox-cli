name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - name: Package release and Homebrew definition
        run: go run ./tools/release --version "${GITHUB_REF_NAME#v}" --output dist
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*_checksums.txt dist/homebrew/workbox.rb
          --verify-tag --generate-notes --draft
  bottle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Build and test native Homebrew bottle
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new maybell/tap
          tap="$(brew --repository maybell/tap)"
          gh release download "$GITHUB_REF_NAME" --pattern workbox.rb --dir "$RUNNER_TEMP/recipe"
          cp "$RUNNER_TEMP/recipe/workbox.rb" "$tap/Formula/workbox.rb"
          git -C "$tap" add Formula/workbox.rb
          git -C "$tap" commit -m "Build workbox ${GITHUB_REF_NAME}"
          brew install --build-bottle maybell/tap/workbox
          brew test maybell/tap/workbox
          mkdir -p "$RUNNER_TEMP/bottles"
          cd "$RUNNER_TEMP/bottles"
          brew bottle --json --no-rebuild \
            --root-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            maybell/tap/workbox
          # Homebrew's local filename uses --; its download URL uses a single -.
          for bottle in ./*.bottle.tar.gz; do
            mv "$bottle" "${bottle/workbox--/workbox-}"
          done
          gh release upload "$GITHUB_REF_NAME" ./*.bottle.tar.gz ./*.bottle.json --clobber
  publish:
    needs: bottle
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Merge bottle metadata and publish complete release
        shell: bash
        run: |
          brew tap-new maybell/tap
          tap="$(brew --repository maybell/tap)"
          gh release download "$GITHUB_REF_NAME" --pattern workbox.rb \
            --pattern '*.bottle.json' --dir "$RUNNER_TEMP/recipe"
          cp "$RUNNER_TEMP/recipe/workbox.rb" "$tap/Formula/workbox.rb"
          brew bottle --merge --write --no-commit "$RUNNER_TEMP/recipe/"*.bottle.json
          gh release upload "$GITHUB_REF_NAME" "$tap/Formula/workbox.rb" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
  verify-install:
    needs: publish
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and test the public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          version="${GITHUB_REF_NAME#v}"
          archive="workbox_${version}_${os}_${arch}.tar.gz"
          destination="$RUNNER_TEMP/workbox-public-install"
          mkdir -p "$destination"
          gh release download "$GITHUB_REF_NAME" --pattern "$archive" \
            --pattern "workbox_${version}_checksums.txt" --dir "$destination"
          cd "$destination"
          if [ "$os" = darwin ]; then
            shasum -a 256 -c "workbox_${version}_checksums.txt" --ignore-missing
          else
            sha256sum --check --ignore-missing "workbox_${version}_checksums.txt"
          fi
          tar -xzf "$archive"
          sh scripts/check-install.sh "$destination/workbox"
