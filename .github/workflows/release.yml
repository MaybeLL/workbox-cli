name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Resume publishing an existing draft with both Mac bottles built (e.g. v0.1.0)'
        required: true
        type: string
permissions:
  contents: write
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - name: Package release and Homebrew definition
        run: go run ./tools/release --version "${RELEASE_TAG#v}" --output dist
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.tar.gz dist/*_checksums.txt dist/homebrew/workbox.rb
          --verify-tag --generate-notes --draft
  bottle:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - name: Build and test native Homebrew bottle
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          brew tap-new maybell/tap
          tap="$(brew --repository maybell/tap)"
          gh release download "$RELEASE_TAG" --pattern workbox.rb --dir "$RUNNER_TEMP/recipe"
          cp "$RUNNER_TEMP/recipe/workbox.rb" "$tap/Formula/workbox.rb"
          git -C "$tap" add Formula/workbox.rb
          git -C "$tap" commit -m "Build workbox ${RELEASE_TAG}"
          brew install --build-bottle maybell/tap/workbox
          brew test maybell/tap/workbox
          mkdir -p "$RUNNER_TEMP/bottles"
          cd "$RUNNER_TEMP/bottles"
          brew bottle --json --no-rebuild \
            --root-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            maybell/tap/workbox
          # Homebrew's local filename uses --; its download URL uses a single -.
          for bottle in ./*.bottle.tar.gz; do
            mv "$bottle" "${bottle/workbox--/workbox-}"
          done
          gh release upload "$RELEASE_TAG" ./*.bottle.tar.gz ./*.bottle.json --clobber
  publish:
    needs: bottle
    if: ${{ !cancelled() && (needs.bottle.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Merge bottle metadata and publish complete release
        shell: bash
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          brew tap-new maybell/tap
          tap="$(brew --repository maybell/tap)"
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --pattern workbox.rb \
            --pattern "workbox--${version}.arm64_sequoia.bottle.json" \
            --pattern "workbox--${version}.sequoia.bottle.json" --dir "$RUNNER_TEMP/recipe"
          cp "$RUNNER_TEMP/recipe/workbox.rb" "$tap/Formula/workbox.rb"
          brew trust --formula maybell/tap/workbox
          brew bottle --merge --write --no-commit "$RUNNER_TEMP/recipe/"*.bottle.json
          gh release upload "$RELEASE_TAG" "$tap/Formula/workbox.rb" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
  verify-install:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and test the public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          version="${RELEASE_TAG#v}"
          archive="workbox_${version}_${os}_${arch}.tar.gz"
          destination="$RUNNER_TEMP/workbox-public-install"
          mkdir -p "$destination"
          gh release download "$RELEASE_TAG" --pattern "$archive" \
            --pattern "workbox_${version}_checksums.txt" --dir "$destination"
          cd "$destination"
          if [ "$os" = darwin ]; then
            shasum -a 256 -c "workbox_${version}_checksums.txt" --ignore-missing
          else
            sha256sum --check --ignore-missing "workbox_${version}_checksums.txt"
          fi
          tar -xzf "$archive"
          sh scripts/check-install.sh "$destination/workbox"
